  .wrap{max-width:420px;margin:0 auto;padding:48px 20px 60px;text-align:center;}
  .avatar{font-size:38px;width:76px;height:76px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .logo-img{display:block;margin:0 auto 16px;object-fit:cover;}
  .logo-img.circle{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 1px var(--border),0 10px 30px rgba(0,0,0,.16);}
  .logo-img.rounded{width:96px;height:96px;border-radius:24px;box-shadow:0 0 0 1px var(--border),0 10px 30px rgba(0,0,0,.16);}
  .logo-img.square{width:96px;height:96px;border-radius:8px;box-shadow:0 0 0 1px var(--border),0 10px 30px rgba(0,0,0,.16);}
  .logo-img.free{width:auto;height:auto;max-width:240px;max-height:110px;object-fit:contain;border-radius:0;}
  h1{margin:0;text-align:center;}
  h1 .tx{font-family:'Orbitron',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:31px;font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:0.02em;}
  .tag{color:var(--muted);margin-top:4px;text-align:center;}
  .tag .tx{font-family:'Press Start 2P','Courier New',monospace;font-size:16.5px;font-weight:400;font-style:normal;text-transform:none;letter-spacing:0.02em;}
  .lnk{justify-content:flex-start;}
  .lt{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14.5px;font-weight:600;font-style:normal;text-transform:none;letter-spacing:0em;text-align:left;}
  .links{display:flex;flex-direction:column;gap:9px;margin-top:26px;text-align:left;}
  .lnk{display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:11px;background:var(--surface);border:1px solid var(--border);color:var(--text);text-decoration:none;font-weight:600;font-size:14.5px;transition:transform .18s,box-shadow .18s,border-color .18s;
    animation-name:var(--an);animation-duration:calc(var(--dur) * var(--dm,1));animation-timing-function:var(--ease,ease-out);animation-delay:calc(var(--base) + var(--i,0) * var(--gap));animation-fill-mode:backwards;}
  @media (hover:hover){.lnk:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.12);border-color:var(--muted);}}
  .lnk:active{transform:scale(.98);}
  .lnk:focus-visible{outline:2px solid var(--text);outline-offset:2px;}
  .page-section{max-width:420px;margin:0 auto 14px;text-align:center;} .header-section{margin-bottom:18px;} .footer-section{margin-top:18px;} .section-card{padding:13px 15px;border-radius:12px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(8px);} .section-title{font-weight:800;font-size:14px;} .section-body{margin-top:5px;color:var(--muted);font-size:12.5px;line-height:1.5;} .page-ad{max-width:420px;margin:18px auto;padding:14px;border-radius:14px;border:1px dashed var(--border);background:rgba(255,255,255,.16);backdrop-filter:blur(8px);font-size:13px;text-align:center;} .ad-link{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:9px;background:var(--text);color:var(--bg);text-decoration:none;font-weight:800;font-size:12px;}
